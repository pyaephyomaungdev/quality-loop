# Validates the skills themselves: frontmatter shape, install script, playbook presence.
name: validate
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md frontmatter + structure
        run: |
          for skill in skills/*/; do
            name=$(basename "$skill")
            test -f "$skill/SKILL.md" || { echo "FAIL: $skill missing SKILL.md"; exit 1; }
            head -1 "$skill/SKILL.md" | grep -q '^---$' || { echo "FAIL: $name frontmatter"; exit 1; }
            grep -q "^name: $name\$" "$skill/SKILL.md" || { echo "FAIL: $name name mismatch"; exit 1; }
            grep -q '^description:' "$skill/SKILL.md" || { echo "FAIL: $name description"; exit 1; }
          done
      - name: install.sh syntax
        run: bash -n install.sh
      - name: install end-to-end
        run: |
          ./install.sh --project /tmp/ql-ci
          test -f /tmp/ql-ci/.agents/skills/quality-loop/SKILL.md
          test -f /tmp/ql-ci/.agents/skills/quality-agent/SKILL.md
          test -x /tmp/ql-ci/.agents/skills/quality-loop/scripts/quality-gates.sh
      - name: references present
        run: |
          test -f skills/quality-loop/references/report-format.md
          test -f skills/quality-loop/references/agent-prompts.md
          test -f skills/quality-loop/references/fix-batch-playbooks.md
